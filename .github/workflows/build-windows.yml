name: Build Windows EXE

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install PySide6 requests pyinstaller

      - name: Build EXE (PyInstaller)
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --name NebulaLauncher --windowed \
            --icon assets/icon.ico \
            --add-data "i18n;i18n" \
            --add-data "assets;assets" \
            --add-data "website;website" \
            main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NebulaLauncher-Windows-x64
          path: dist/NebulaLauncher/

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          powershell -Command "Compress-Archive -Path NebulaLauncher -DestinationPath NebulaLauncher-Windows-x64.zip -Force"
          gh release upload "${GITHUB_REF_NAME}" "NebulaLauncher-Windows-x64.zip" --repo "${GITHUB_REPOSITORY}" --clobber
